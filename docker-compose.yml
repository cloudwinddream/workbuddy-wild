# WorkBuddy-Wild Web 版 Docker Compose 部署
#
# 用法：
#   1. 把 WB2A_API_KEY 换成强随机值（管理页 + /v1 接口的 Bearer 密钥）
#   2. docker compose up -d --build
#   3. 浏览器打开 http://<服务器IP>:7863/ ，首次会提示输入 API Key
#   4. 在页面右上“＋ WorkBuddy / ＋ TraeWork”添加账号
#
# 数据持久化：./data 挂载到 /data（含 auths/ 账号、state-*.json 状态、
# app.log 日志）。升级时重建容器即可，数据不受影响。

services:
  workbuddy-wild-web:
    build:
      context: .
      dockerfile: Dockerfile
    image: workbuddy-wild-web:latest
    container_name: workbuddy-wild-web
    restart: unless-stopped
    ports:
      - "7863:7863"
    environment:
      # 监听全部网卡（容器内必须是 :7863，不能写 127.0.0.1:7863）
      WB2A_LISTEN: ":7863"
      # ⚠️ 务必改成强随机值！这是管理页与 /v1 接口的 Bearer 鉴权密钥。
      # 留空 = 不鉴权（仅建议可信内网调试时这么做）。
      WB2A_API_KEY: "CHANGE_ME_强随机密钥"
      WB2A_AUTH_DIR: "/data/auths"
      WB2A_STATE_FILE: "/data/state.json"
      # TraeWork 登录回调用：浏览器与服务端不在同一台机器时，
      # 填浏览器可访问的地址，如 http://192.168.1.10:7863
      # （SSH 端口转发场景可留空，默认用 http://127.0.0.1:7863）
      WB2A_PUBLIC_URL: ""
      # 签到时间按此时区计算
      TZ: "Asia/Shanghai"
      # 主账号启动兜底补签（错过签到时刻且今日未签时启动后补签；true/false）
      WB2A_CATCHUP_ON_STARTUP: "${WB2A_CATCHUP_ON_STARTUP:-true}"
      # ---- 福利吧论坛签到（Go 原生模块，签到控制台 http://<服务器IP>:7863/）----
      # 账号也可在网页上直接登录；这里填了则容器首次启动时自动导入。
      # 推荐写在 .env 里（见 .env.example），不要直接提交到仓库。
      FORUM_USERNAME: "${FORUM_USERNAME:-}"
      FORUM_PASSWORD: "${FORUM_PASSWORD:-}"
      # 启动后是否先跑一次签到（true/false）；签到时间统一在控制台设置
      WNFLB_RUN_ON_STARTUP: "${WNFLB_RUN_ON_STARTUP:-true}"
      # 论坛基址（论坛换域名时改这里）
      WNFLB_BASE_URL: "${WNFLB_BASE_URL:-https://www.wnflb2023.com}"
      # ---- 什么值得买签到（Go 原生模块，签到控制台 http://<服务器IP>:7863/）----
      # Cookie 也可在签到中心页面直接粘贴；这里填了则容器首次启动时自动导入。
      # 推荐写在 .env 里（见 .env.example），不要直接提交到仓库。
      SMZDM_COOKIE: "${SMZDM_COOKIE:-}"
      # 启动后是否先跑一次签到（true/false）；签到时间统一在控制台设置
      SMZDM_RUN_ON_STARTUP: "${SMZDM_RUN_ON_STARTUP:-true}"
      # 接口基址（一般不用改）
      SMZDM_BASE_URL: "${SMZDM_BASE_URL:-https://user-api.smzdm.com}"
      # ---- 签到结果 Bark 推送（签到中心页面也可配置，此处仅首次引导）----
      BARK_SERVER: "${BARK_SERVER:-https://api.day.app}"
      BARK_KEY: "${BARK_KEY:-}"
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1:7863/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
