<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>福利吧签到</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
         margin: 0; padding: 20px; background: #f5f6f8; color: #222; }
  .wrap { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: #888; font-size: 13px; margin-bottom: 16px; }
  .sub a { color: #1677ff; text-decoration: none; }
  .card { background: #fff; border-radius: 10px; padding: 16px 18px;
          margin-bottom: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.06); }
  .row { display: flex; justify-content: space-between; padding: 7px 0;
         border-bottom: 1px solid #f0f0f0; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  .k { color: #888; }
  .v { font-weight: 500; }
  .ok { color: #189225; } .bad { color: #d4380d; } .muted { color: #aaa; }
  input[type=text], input[type=password] {
    width: 100%; padding: 9px 10px; margin: 6px 0; font-size: 14px;
    border: 1px solid #d9d9d9; border-radius: 6px; }
  button { padding: 9px 18px; font-size: 14px; border: none; border-radius: 6px;
           background: #1677ff; color: #fff; cursor: pointer; margin: 6px 8px 6px 0; }
  button:disabled { background: #bcd6ff; cursor: default; }
  button.ghost { background: #f0f0f0; color: #333; }
  #captchaBox { display: none; }
  #captchaImg { display: block; margin: 8px 0; border: 1px solid #eee;
                border-radius: 6px; cursor: pointer; }
  #msg { min-height: 20px; font-size: 13px; color: #d4380d; margin-top: 6px; }
  #keyOverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.45);
                align-items: center; justify-content: center; z-index: 50; }
  #keyOverlay .card { width: 320px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>福利吧签到</h1>
  <div class="sub"><a href="/">← 返回主管理页</a> · 论坛 wnflb2023.com · 每日自动签到</div>

  <div class="card" id="statusCard">
    <div class="row"><span class="k">登录状态</span><span class="v" id="stLogin">—</span></div>
    <div class="row"><span class="k">当前积分</span><span class="v" id="stCredits">—</span></div>
    <div class="row"><span class="k">上次签到</span><span class="v" id="stLast">—</span></div>
    <div class="row"><span class="k">下次签到</span><span class="v" id="stNext">—</span></div>
  </div>

  <div class="card" id="loginCard" style="display:none">
    <div style="font-weight:600;margin-bottom:6px">账号登录</div>
    <input type="text" id="username" placeholder="论坛账号" autocomplete="username">
    <input type="password" id="password" placeholder="论坛密码" autocomplete="current-password">
    <div><button id="btnLogin">登录</button></div>
    <div id="captchaBox">
      <div style="font-size:13px;color:#888">本次登录需要验证码（点击图片可换一张）：</div>
      <img id="captchaImg" alt="验证码">
      <input type="text" id="captchaCode" placeholder="输入验证码" autocomplete="off">
      <div><button id="btnCaptcha">提交验证码</button></div>
    </div>
  </div>

  <div class="card" id="actionCard" style="display:none">
    <button id="btnCheckin">立即签到</button>
    <button id="btnLogout" class="ghost">退出登录</button>
  </div>

  <div id="msg"></div>
</div>

<div id="keyOverlay">
  <div class="card">
    <div style="font-weight:600;margin-bottom:8px">输入管理页 API Key</div>
    <input type="password" id="apiKeyInput" placeholder="WB2A_API_KEY 的值">
    <div><button id="btnKey">确定</button></div>
  </div>
</div>

<script>
(function () {
  "use strict";
  var LS_KEY = "wbw_api_key"; // 与主管理页共用
  var captchaId = "";
  var captchaUser = "", captchaPass = "";

  function $(id) { return document.getElementById(id); }
  function key() { try { return sessionStorage.getItem(LS_KEY) || ""; } catch (e) { return ""; } }

  async function api(method, path, body) {
    var headers = {};
    var k = key();
    if (k) headers["Authorization"] = "Bearer " + k;
    if (body !== undefined) headers["Content-Type"] = "application/json";
    var r = await fetch(path, {
      method: method, headers: headers,
      body: body === undefined ? undefined : JSON.stringify(body)
    });
    if (r.status === 401) { $("keyOverlay").style.display = "flex"; throw new Error("401"); }
    return r.json();
  }

  function say(t, ok) {
    var m = $("msg");
    m.textContent = t;
    m.style.color = ok === true ? "#189225" : (ok === false ? "#d4380d" : "#666");
  }

  async function refresh() {
    try {
      var s = await api("GET", "/api/wnflb/status");
      $("stLogin").innerHTML = s.logged_in
        ? '<span class="ok">已登录（' + esc(s.username) + '）</span>'
        : (s.has_account ? '<span class="bad">登录已过期</span>' : '<span class="muted">未登录</span>');
      $("stCredits").textContent = s.credits || "—";
      $("stLast").textContent = s.last_checkin
        ? s.last_checkin + " · " + (s.last_msg || "") : "—";
      $("stNext").textContent = (s.next_checkin || "—") +
        (s.checkin_times ? "（" + s.checkin_times + "）" : "");
      $("loginCard").style.display = s.logged_in ? "none" : "block";
      $("actionCard").style.display = s.logged_in ? "block" : "none";
      if (!s.logged_in) { $("captchaBox").style.display = "none"; }
    } catch (e) { if (e.message !== "401") say("状态获取失败：" + e.message, false); }
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  $("btnLogin").onclick = async function () {
    var u = $("username").value.trim(), p = $("password").value;
    if (!u || !p) { say("请输入账号和密码", false); return; }
    say("登录中…");
    try {
      var r = await api("POST", "/api/wnflb/login", { username: u, password: p });
      if (r.ok) { say("登录成功", true); captchaId = ""; refresh(); return; }
      if (r.need_captcha) {
        captchaId = r.captcha_id; captchaUser = u; captchaPass = p;
        $("captchaBox").style.display = "block";
        loadCaptcha();
        say("本次登录需要验证码，请识别并提交", false);
        return;
      }
      say(r.msg || "登录失败", false);
    } catch (e) { if (e.message !== "401") say("登录请求失败：" + e.message, false); }
  };

  function loadCaptcha() {
    // 图片请求也要带 Bearer：用 fetch 转 blob 再展示
    var headers = {};
    var k = key();
    if (k) headers["Authorization"] = "Bearer " + k;
    fetch("/api/wnflb/captcha?id=" + encodeURIComponent(captchaId) + "&t=" + Date.now(),
        { headers: headers })
      .then(function (r) { if (!r.ok) throw new Error("拉取失败"); return r.blob(); })
      .then(function (b) { $("captchaImg").src = URL.createObjectURL(b); })
      .catch(function (e) { say("验证码拉取失败：" + e.message, false); });
  }
  $("captchaImg").onclick = loadCaptcha;

  $("btnCaptcha").onclick = async function () {
    var code = $("captchaCode").value.trim();
    if (!code) { say("请输入验证码", false); return; }
    say("提交中…");
    try {
      var r = await api("POST", "/api/wnflb/captcha",
        { id: captchaId, code: code, username: captchaUser, password: captchaPass });
      if (r.ok) { say("登录成功", true); captchaId = ""; refresh(); return; }
      if (r.need_retry) {
        captchaId = r.captcha_id;
        $("captchaCode").value = "";
        loadCaptcha();
        say(r.msg || "验证码不正确，已换一张", false);
        return;
      }
      say(r.msg || "登录失败", false);
    } catch (e) { if (e.message !== "401") say("提交失败：" + e.message, false); }
  };

  $("btnCheckin").onclick = async function () {
    say("签到中…");
    try {
      var r = await api("POST", "/api/wnflb/checkin");
      say(r.msg || (r.ok ? "完成" : "失败"), r.ok);
      refresh();
    } catch (e) { if (e.message !== "401") say("签到请求失败：" + e.message, false); }
  };

  $("btnLogout").onclick = async function () {
    try { await api("POST", "/api/wnflb/logout"); say("已退出登录", true); refresh(); }
    catch (e) { if (e.message !== "401") say("退出失败：" + e.message, false); }
  };

  $("btnKey").onclick = function () {
    var v = $("apiKeyInput").value;
    try { sessionStorage.setItem(LS_KEY, v); } catch (e) {}
    $("keyOverlay").style.display = "none";
    refresh();
  };

  refresh();
  setInterval(refresh, 10000);
})();
</script>
</body>
</html>
